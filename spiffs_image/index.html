<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receiver Bluetooth DIY</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
    <h1 id="device-name">Receiver Bluetooth DIY</h1>

    <div class="card">
        <div class="track" id="track">—</div>
        <div class="track-sub" id="artist-album">—</div>
        <div class="row">
            <span class="label">Bluetooth</span>
            <span class="badge off" id="bt-badge">desconectado</span>
        </div>
        <div class="row" id="bt-device-row" style="display:none">
            <span class="label">Dispositivo</span>
            <span id="bt-device-name">—</span>
        </div>
        <div class="row">
            <span class="label">Visível para parear</span>
            <span class="badge off" id="pairing-badge">desligado</span>
        </div>
        <button type="button" id="pairing-btn" style="margin-top:0.5rem">Permitir pareamento (3 min)</button>
        <div class="row">
            <span class="label">DLNA</span>
            <span class="badge off" id="dlna-badge">inativo</span>
        </div>
        <div class="row" id="dlna-device-row" style="display:none">
            <span class="label">Control point</span>
            <span id="dlna-client-ip">—</span>
        </div>
        <div class="row" id="dlna-position-row" style="display:none">
            <span class="label">Posição</span>
            <span id="dlna-position">—</span>
        </div>
        <div class="row">
            <span class="label">Amplificador</span>
            <span class="badge off" id="amp-badge">desligado</span>
        </div>
        <div class="row" id="media-controls" style="display:none; gap:0.5rem; margin-top:0.75rem">
            <button type="button" id="media-prev" style="margin-top:0">⏮</button>
            <button type="button" id="media-playpause" style="margin-top:0">⏯</button>
            <button type="button" id="media-next" style="margin-top:0">⏭</button>
        </div>
        <button type="button" id="disconnect-btn" style="display:none; margin-top:0.75rem">Desconectar</button>
    </div>

    <div class="card">
        <label for="volume">Volume <span id="volume-value">70</span></label>
        <input type="range" id="volume" min="0" max="100" value="70" title="70">
    </div>

    <div class="card">
        <div class="row"><span class="label">IP</span><span id="wifi-ip">—</span></div>
        <div class="row"><span class="label">MAC Bluetooth</span><span id="device-mac">—</span></div>
        <div class="row"><span class="label">Uptime</span><span id="uptime">—</span></div>
    </div>

    <nav><a href="/settings.html">Configurações</a> &middot; <a href="/devices.html">Dispositivos</a></nav>
</main>

<script src="/app.js"></script>
<script>
let volumeDragging = false;

function setVolumeDisplay(v) {
    document.getElementById("volume-value").textContent = v;
    document.getElementById("volume").title = v;
}

document.getElementById("volume").addEventListener("input", (e) => {
    volumeDragging = true;
    setVolumeDisplay(e.target.value);
});
document.getElementById("volume").addEventListener("change", async (e) => {
    await apiPost("/api/volume", { volume: parseInt(e.target.value, 10) });
    volumeDragging = false;
});

let dlnaPositionSecs = 0;
let dlnaDurationText = "0:00:00";
let dlnaTicking = false;

function parseHMS(text) {
    const parts = (text || "0:00:00").split(":").map(Number);
    while (parts.length < 3) parts.unshift(0);
    return parts[0] * 3600 + parts[1] * 60 + parts[2];
}

function fmtHMS(totalSecs) {
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = Math.floor(totalSecs % 60);
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function renderDlnaPosition() {
    const known = dlnaDurationText && dlnaDurationText !== "0:00:00";
    document.getElementById("dlna-position").textContent =
        known ? `${fmtHMS(dlnaPositionSecs)} / ${dlnaDurationText}` : fmtHMS(dlnaPositionSecs);
}

setInterval(() => {
    if (dlnaTicking) {
        dlnaPositionSecs++;
        renderDlnaPosition();
    }
}, 1000);

async function refresh() {
    try {
        const s = await apiGet("/api/status");
        document.getElementById("device-name").textContent = s.device_name;
        document.getElementById("track").textContent = s.track || "Nenhuma faixa";
        document.getElementById("artist-album").textContent =
            [s.artist, s.album].filter(Boolean).join(" — ") || "—";

        const btBadge = document.getElementById("bt-badge");
        btBadge.textContent = s.bt_connected ? (s.playing ? "tocando" : "conectado") : "desconectado";
        btBadge.className = "badge " + (s.bt_connected ? "on" : "off");

        const deviceRow = document.getElementById("bt-device-row");
        const disconnectBtn = document.getElementById("disconnect-btn");
        const mediaControls = document.getElementById("media-controls");
        if (s.bt_connected) {
            document.getElementById("bt-device-name").textContent =
                s.bt_remote_name || s.bt_remote_mac || "—";
            deviceRow.style.display = "flex";
            disconnectBtn.style.display = "block";
            disconnectBtn.dataset.mac = s.bt_remote_mac;
        } else {
            deviceRow.style.display = "none";
            disconnectBtn.style.display = "none";
        }
        /* Controles tambem no DLNA -- antes so apareciam no Bluetooth. Mas
         * ⏮/⏭ ficam escondidos no DLNA: a fila pertence ao control point
         * (Music Assistant) e o protocolo nao permite ao renderer pedir
         * "proxima faixa". Melhor nao mostrar botao que nao funciona. */
        const dlnaAtivo = !s.bt_connected && (s.dlna_state === "playing" || s.dlna_state === "paused");
        mediaControls.style.display = (s.bt_connected || dlnaAtivo) ? "flex" : "none";
        const skipDisplay = s.bt_connected ? "inline-block" : "none";
        document.getElementById("media-prev").style.display = skipDisplay;
        document.getElementById("media-next").style.display = skipDisplay;

        /* O badge segue o ESTADO REAL do transporte, nao a assinatura de
         * eventos. Erro anterior: usava dlna_subscribed, e como o Music
         * Assistant nem sempre assina o eventing (ele funciona por polling
         * tambem), a pagina mostrava "inativo" com a musica tocando.
         * dlna_subscribed continua no /api/status, mas so pra diagnostico. */
        const dlnaBadge = document.getElementById("dlna-badge");
        let dlnaTexto, dlnaAtivoBadge;
        if (s.dlna_state === "playing") {
            dlnaTexto = "tocando";
            dlnaAtivoBadge = true;
        } else if (s.dlna_state === "paused") {
            dlnaTexto = "pausado";
            dlnaAtivoBadge = true;
        } else if (s.dlna_client_ip) {
            dlnaTexto = "conectado"; /* control point ja falou com a gente, mas parado */
            dlnaAtivoBadge = true;
        } else {
            dlnaTexto = "inativo";
            dlnaAtivoBadge = false;
        }
        dlnaBadge.textContent = dlnaTexto;
        dlnaBadge.className = "badge " + (dlnaAtivoBadge ? "on" : "off");
        const dlnaRow = document.getElementById("dlna-device-row");
        if (s.dlna_client_ip) {
            document.getElementById("dlna-client-ip").textContent =
                s.dlna_client_agent ? `${s.dlna_client_ip} (${s.dlna_client_agent})` : s.dlna_client_ip;
            dlnaRow.style.display = "flex";
        } else {
            dlnaRow.style.display = "none";
        }

        const dlnaPositionRow = document.getElementById("dlna-position-row");
        if (s.dlna_state === "playing" || s.dlna_state === "paused") {
            dlnaPositionSecs = parseHMS(s.dlna_position);
            dlnaDurationText = s.dlna_duration || "0:00:00";
            dlnaTicking = s.dlna_state === "playing";
            renderDlnaPosition();
            dlnaPositionRow.style.display = "flex";
        } else {
            dlnaTicking = false;
            dlnaPositionRow.style.display = "none";
        }

        const ampBadge = document.getElementById("amp-badge");
        ampBadge.textContent = s.amplifier ? "ligado" : "desligado";
        ampBadge.className = "badge " + (s.amplifier ? "on" : "off");

        if (!volumeDragging) {
            document.getElementById("volume").value = s.volume;
            setVolumeDisplay(s.volume);
        }
        btPairing.update(s);
        document.getElementById("wifi-ip").textContent = s.wifi_ip || "sem rede";
        document.getElementById("device-mac").textContent = s.device_mac;
        document.getElementById("uptime").textContent = fmtUptime(s.uptime_s);
    } catch (e) {
        console.error(e);
    }
}

document.getElementById("disconnect-btn").addEventListener("click", async (e) => {
    const mac = e.target.dataset.mac;
    if (mac) {
        await apiPost("/api/pair", { mac, action: "disconnect" });
    }
});

document.getElementById("media-prev").addEventListener("click", () => apiPost("/api/media", { cmd: "previous" }));
document.getElementById("media-playpause").addEventListener("click", () => apiPost("/api/media", { cmd: "playpause" }));
document.getElementById("media-next").addEventListener("click", () => apiPost("/api/media", { cmd: "next" }));

btPairing.init("pairing-badge", "pairing-btn", refresh);

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
