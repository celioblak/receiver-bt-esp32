<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurações — Receiver Bluetooth DIY</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
    <h1>Configurações</h1>
    <nav><a href="/index.html">&larr; Voltar</a></nav>

    <div class="card">
        <form id="config-form">
            <label for="device_name">Nome do dispositivo (Bluetooth)</label>
            <input type="text" id="device_name" maxlength="31">

            <label for="wifi_ssid">Rede Wi-Fi (SSID)</label>
            <input type="text" id="wifi_ssid" maxlength="32">

            <label for="wifi_pass">Senha Wi-Fi</label>
            <input type="password" id="wifi_pass" maxlength="64" placeholder="deixe em branco para manter">

            <label for="relay_timeout_s">Timeout do amplificador (segundos sem tocar)</label>
            <input type="number" id="relay_timeout_s" min="5" max="600">

            <label for="mqtt_host">Broker MQTT (Home Assistant) — endereço</label>
            <input type="text" id="mqtt_host" maxlength="63" placeholder="deixe em branco para desativar">

            <label for="mqtt_port">Porta MQTT</label>
            <input type="number" id="mqtt_port" min="1" max="65535">

            <label for="mqtt_user">Usuário MQTT</label>
            <input type="text" id="mqtt_user" maxlength="31">

            <label for="mqtt_pass">Senha MQTT</label>
            <input type="password" id="mqtt_pass" maxlength="63" placeholder="deixe em branco para manter">

            <button type="submit">Salvar</button>
            <div id="save-msg"></div>
        </form>
    </div>

    <div class="card">
        <label for="volume-fine">Volume</label>
        <input type="range" id="volume-fine" min="0" max="200" value="140">

        <div class="row">
            <span class="label">AGC (normalização entre fontes)</span>
            <input type="checkbox" id="agc-enabled">
        </div>

        <div id="agc-details" style="display:none">
            <label for="agc-target">Nível alvo (dBFS)</label>
            <input type="range" id="agc-target" min="-30" max="-6" value="-18">

            <label for="agc-mode">Modo</label>
            <select id="agc-mode">
                <option value="0">Suave</option>
                <option value="1" selected>Médio</option>
                <option value="2">Agressivo</option>
            </select>

            <div class="row"><span class="label">Ganho atual</span><span id="agc-gain">1.00x</span></div>
        </div>
    </div>

    <div class="card">
        <label for="ota-file">Atualizar firmware (.bin)</label>
        <input type="file" id="ota-file" accept=".bin">
        <button id="ota-upload">Enviar e reiniciar</button>
        <div id="ota-msg" class="track-sub" style="margin-top:0.5rem"></div>
    </div>
</main>

<script src="/app.js"></script>
<script>
document.getElementById("ota-upload").addEventListener("click", async () => {
    const input = document.getElementById("ota-file");
    const msg = document.getElementById("ota-msg");
    if (!input.files.length) {
        msg.textContent = "Escolha um arquivo .bin primeiro.";
        return;
    }
    msg.textContent = "Enviando " + input.files[0].name + " (" + input.files[0].size + " bytes)...";
    try {
        const res = await fetch("/ota", { method: "POST", body: input.files[0] });
        if (!res.ok) throw new Error("HTTP " + res.status);
        msg.textContent = "Enviado. O dispositivo esta reiniciando...";
    } catch (e) {
        msg.textContent = "Falha no envio: " + e.message;
    }
});

async function load() {
    const c = await apiGet("/api/config");
    document.getElementById("device_name").value = c.device_name;
    document.getElementById("wifi_ssid").value = c.wifi_ssid;
    document.getElementById("relay_timeout_s").value = c.relay_timeout_s;
    document.getElementById("mqtt_host").value = c.mqtt_host;
    document.getElementById("mqtt_port").value = c.mqtt_port;
    document.getElementById("mqtt_user").value = c.mqtt_user;
}

/* -------------------------------------------------------------------------
 * Volume fino + AGC
 * ------------------------------------------------------------------------- */

let volumeDragging = false;
const agcDetails = document.getElementById("agc-details");

function setAgcDetailsVisible(visible) {
    agcDetails.style.display = visible ? "block" : "none";
}

document.getElementById("volume-fine").addEventListener("input", () => {
    volumeDragging = true;
});
document.getElementById("volume-fine").addEventListener("change", async (e) => {
    await apiPost("/api/volume", { volume: parseInt(e.target.value, 10) });
    volumeDragging = false;
});

document.getElementById("agc-enabled").addEventListener("change", async (e) => {
    setAgcDetailsVisible(e.target.checked);
    await apiPost("/api/agc", { enabled: e.target.checked });
});
document.getElementById("agc-target").addEventListener("change", async (e) => {
    await apiPost("/api/agc", { target: parseInt(e.target.value, 10) });
});
document.getElementById("agc-mode").addEventListener("change", async (e) => {
    await apiPost("/api/agc", { mode: parseInt(e.target.value, 10) });
});

async function refreshVolumeAgc() {
    try {
        const s = await apiGet("/api/status");
        if (!volumeDragging) {
            document.getElementById("volume-fine").value = s.volume;
        }
        document.getElementById("agc-enabled").checked = s.agc_enabled;
        document.getElementById("agc-target").value = s.agc_target;
        document.getElementById("agc-mode").value = s.agc_mode;
        document.getElementById("agc-gain").textContent = s.agc_gain.toFixed(2) + "x";
        setAgcDetailsVisible(s.agc_enabled);
    } catch (e) {
        console.error(e);
    }
}

refreshVolumeAgc();
setInterval(refreshVolumeAgc, 2000);

document.getElementById("config-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
        device_name: document.getElementById("device_name").value,
        wifi_ssid: document.getElementById("wifi_ssid").value,
        relay_timeout_s: parseInt(document.getElementById("relay_timeout_s").value, 10),
        mqtt_host: document.getElementById("mqtt_host").value,
        mqtt_port: parseInt(document.getElementById("mqtt_port").value, 10) || 1883,
        mqtt_user: document.getElementById("mqtt_user").value,
    };
    const wifiPass = document.getElementById("wifi_pass").value;
    if (wifiPass) body.wifi_pass = wifiPass;
    const mqttPass = document.getElementById("mqtt_pass").value;
    if (mqttPass) body.mqtt_pass = mqttPass;

    const resp = await apiPost("/api/config", body);
    document.getElementById("save-msg").textContent = resp.message || "Salvo.";
});

load();
</script>
</body>
</html>
