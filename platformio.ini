; Receiver Bluetooth DIY — ESP32 Audio Kit V2.2 (ESP32-A1S + ES8388)
; Framework: ESP-IDF nativo (NÃO Arduino)
; Bluetooth A2DP: API Bluedroid nativa do ESP-IDF (esp_a2dp_api.h)
; Áudio: driver I2S nativo do ESP-IDF (driver/i2s_std.h) + driver ES8388
; próprio (main/es8388.c) — sem ESP-ADF (ver README: colisão de nomes de
; arquivo do ESP-ADF com o esquema de build do PlatformIO/SCons).

[platformio]
; O PlatformIO usa "src/" por padrão; mantemos "main/" (convenção nativa do
; ESP-IDF, usada em toda a documentação deste projeto).
src_dir = main
; Idem para a imagem SPIFFS: o padrão do PlatformIO é a pasta "data/", mas
; os arquivos da interface web (index.html etc.) ficam em "spiffs_image/".
; Sem isso, "Upload Filesystem Image" nao encontra nada pra enviar e o
; SPIFFS no dispositivo fica vazio -> 404 "Nothing matches the given URI".
data_dir = spiffs_image

[env:esp32-a1s]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = espidf

board_build.partitions = partitions.csv

; Desabilita o modo sniff do Bluetooth (perfil A2DP/AVRCP) patcheando o
; framework local -- causa ruido audivel no ES8388 quando o audio esta
; pausado. Ver scripts/patch_bt_no_sniff.py para detalhes; roda a cada
; build e e seguro rodar em maquina nova / framework reinstalado.
extra_scripts = pre:scripts/patch_bt_no_sniff.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
