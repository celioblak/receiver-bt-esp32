; Receiver Bluetooth DIY — ESP32 Audio Kit V2.2 (ESP32-A1S + ES8388)
; Framework: ESP-IDF nativo (NÃO Arduino)
; Biblioteca de áudio/BT: ESP-ADF (via variável de ambiente ADF_PATH)

[env:esp32-a1s]
platform = espressif32
board = esp32dev
framework = espidf

board_build.partitions = huge_app.csv
board_build.cmake_extra_args =
    -DADF_PATH=$ENV{ADF_PATH}

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_CLASSIC_BT_ENABLED=1
    -DCONFIG_A2DP_ENABLE=1
    -DCONFIG_AVRC_CT_ENABLE=1
